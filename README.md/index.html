<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Gjøremål</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
    :root{font-family:'DM Sans',sans-serif;color:#20231f;background:#f5f4ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#e8eee4 0,#f5f4ef 58%)}.app{width:min(100% - 40px,620px);margin:auto;padding:96px 0 48px}header{margin:0 0 34px 8px}.eyebrow{color:#738070;font-size:11px;font-weight:700;letter-spacing:.17em}h1{margin:10px 0 8px;font:800 clamp(42px,8vw,58px)/1 'Manrope',sans-serif;letter-spacing:-.055em}h1 span{color:#e58e61}.intro{margin:0;color:#7b8078;font-size:15px}.card{padding:24px;border:1px solid #e8e8df;border-radius:18px;background:#fffffde0;box-shadow:0 18px 55px #2834210b}form{display:flex;gap:10px}input[type=text]{min-width:0;flex:1;padding:14px 16px;border:1px solid #e8e8df;border-radius:10px;outline:none;background:#fbfbf8;font:inherit}input:focus{border-color:#819379;box-shadow:0 0 0 3px #81937920}form button{padding:0 17px;border:0;border-radius:10px;background:#35483a;color:white;font:600 14px 'DM Sans',sans-serif;cursor:pointer}form button:hover{background:#26372b}.heading{display:flex;align-items:center;justify-content:space-between;margin:30px 2px 10px}h2{margin:0;font:700 15px 'Manrope',sans-serif}.count,.note{color:#81867d;font-size:12px}ul{margin:0;padding:0;list-style:none}.task{display:flex;align-items:center;gap:12px;padding:14px 3px;border-bottom:1px solid #efefe9}.task input{appearance:none;flex:0 0 19px;width:19px;height:19px;margin:0;border:1px solid #d9ddd4;border-radius:50%;cursor:pointer}.task input:checked{border-color:#71856d;background:#71856d;box-shadow:inset 0 0 0 4px white}.task label{flex:1;overflow-wrap:anywhere;font-size:14px;cursor:pointer}.task.done label{color:#a0a49d;text-decoration:line-through}.delete{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#969b92;font-size:18px;cursor:pointer}.delete:hover{background:#f6eeea;color:#ba684e}.empty{padding:22px 0 12px;color:#959990;font-size:13px;text-align:center}footer{display:flex;justify-content:flex-end;padding-top:15px}.text-button{border:0;background:transparent;color:#81867d;font:500 12px 'DM Sans',sans-serif;cursor:pointer}.note{text-align:center;margin:16px 0;color:#959990}@media(max-width:480px){.app{padding-top:60px}.card{padding:18px}form{flex-wrap:wrap}form button{min-height:46px}}
  </style>
</head>
<body>
  <main class="app">
    <header><p class="eyebrow">DAGEN DIN, I DITT TEMPO</p><h1>Gjøremål<span>.</span></h1><p class="intro">Få oversikt. Ta én ting om gangen.</p></header>
    <section class="card" aria-label="Oppgaveliste">
      <form id="form"><label class="sr-only" for="input">Ny oppgave</label><input id="input" type="text" maxlength="120" placeholder="Hva må gjøres?" autocomplete="off" required><button>Legg til ＋</button></form>
      <div class="heading"><h2>Oppgavene dine</h2><span class="count" id="count" aria-live="polite"></span></div>
      <ul id="list"></ul><p class="empty" id="empty">Tomt her enn så lenge. Legg til dagens første oppgave.</p>
      <footer><button class="text-button" id="clear" type="button">Fjern fullførte</button></footer>
    </section><p class="note">Oppgavene lagres automatisk på denne enheten.</p>
  </main>
  <script>
    const KEY="gjoremal.tasks.v1",form=document.querySelector("#form"),input=document.querySelector("#input"),list=document.querySelector("#list"),empty=document.querySelector("#empty"),count=document.querySelector("#count");let tasks=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.id==="string"&&typeof t.text==="string")}catch{}
    function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}function render(){list.replaceChildren();for(const task of tasks){const li=document.createElement("li");li.className=`task${task.completed?" done":""}`;const check=document.createElement("input");check.type="checkbox";check.checked=task.completed;check.id=`task-${task.id}`;check.setAttribute("aria-label",`Marker ${task.text} som fullført`);check.addEventListener("change",()=>{task.completed=check.checked;save();render()});const label=document.createElement("label");label.htmlFor=check.id;label.textContent=task.text;const del=document.createElement("button");del.type="button";del.className="delete";del.textContent="×";del.setAttribute("aria-label",`Slett ${task.text}`);del.addEventListener("click",()=>{tasks=tasks.filter(t=>t.id!==task.id);save();render()});li.append(check,label,del);list.append(li)}const n=tasks.filter(t=>!t.completed).length;count.textContent=`${n} igjen`;empty.hidden=tasks.length>0;document.querySelector("#clear").disabled=!tasks.some(t=>t.completed)}
    form.addEventListener("submit",e=>{e.preventDefault();const text=input.value.trim();if(!text)return;tasks.push({id:crypto.randomUUID(),text,completed:false});save();render();form.reset();input.focus()});document.querySelector("#clear").addEventListener("click",()=>{tasks=tasks.filter(t=>!t.completed);save();render()});render();
  </script>
</body>
</html>
